name: Upload verified GSI delivery

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upload-verified-gsi]

permissions:
  contents: write

concurrency:
  group: upload-verified-gsi-phase2
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: '447294982'
      RELEASE_TAG: phase2-los22.2-20260105-rro1
      XZ_OPT: ''
      XZ_DEFAULTS: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download and authenticate the exact original GSI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip e2fsprogs
          mkdir -p courier delivery
          curl --http1.1 -fLsS --retry 5 --retry-all-errors --max-time 1200 \
            'https://downloads.sourceforge.net/project/misterztr-gsi/LineageOS/Android%2015/LineageOS-22.2-20260105-GAPPS-EXT4-GSI.7z' \
            -o courier/original.7z
          echo 'cf4992731f0fbb2a3d09fffeb16ed4f16ad8c023b38427cdc12a0818bc55c7c4  courier/original.7z' | sha256sum -c -
          7zz x -so -bsp0 courier/original.7z LineageOS-22.2-20260105-GAPPS-EXT4-GSI.img | \
            cp --sparse=always /dev/stdin courier/original-system.img
          echo 'cd3599e056ba82bc19379fbca7e81ee572589e0dd81b75092c1fee1691a077b7  courier/original-system.img' | sha256sum -c -
          chmod 444 courier/original-system.img
      - name: Reconstruct the exact image already verified in Codex Cloud
        run: |
          set -euo pipefail
          python3 scripts/apply-image-delta.py --input courier/original-system.img \
            --delta release-files/system-blocks.delta.gz --metadata release-files/system-blocks.json \
            --output courier/system.img
          sudo e2fsck -f -n courier/system.img
      - name: Reproduce and require the same compressed hash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.request
          meta = json.loads(pathlib.Path('release-files/xz-toolchain.json').read_text())
          root = pathlib.Path('courier/xz'); root.mkdir()
          for name, info in meta['packages'].items():
              file = root / (name + '.deb')
              urllib.request.urlretrieve(info['url'], file)
              assert hashlib.sha256(file.read_bytes()).hexdigest() == info['sha256']
              subprocess.run(['dpkg-deb', '-x', str(file), str(root)], check=True)
          PY
          export LD_LIBRARY_PATH="$PWD/courier/xz/usr/lib/x86_64-linux-gnu"
          courier/xz/usr/bin/xz -T4 -6 --block-size=24MiB --check=crc64 --memlimit-compress=1GiB \
            --stdout courier/system.img > delivery/system.img.xz
          echo '4a8641bd3557eb64abb2933742be320932cb821a5724a848994bc88a7a816b02  delivery/system.img.xz' | sha256sum -c -
          courier/xz/usr/bin/xz --test delivery/system.img.xz
      - name: Verify all delivery files before uploading
        run: |
          set -euo pipefail
          cp release-files/TEST-REPORT.md release-files/WINDOWS-DSU.md release-files/SHA256SUMS \
            release-files/sm-a1560-fingerprint-fix-source-and-validation.zip delivery/
          cp dist/SmA1560FingerprintFix.apk delivery/
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('release-files/DELIVERY.json').read_text())
          for name, info in manifest['files'].items():
              p = pathlib.Path('delivery', name)
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(b)
              assert p.stat().st_size == info['bytes'] and h.hexdigest() == info['sha256'], name
              print('Verified delivery file:', name, h.hexdigest())
          PY
      - name: Upload only to the existing draft with the repository-scoped Actions token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft')" = true
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.tag_name')" = "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" delivery/system.img.xz delivery/SHA256SUMS \
            delivery/TEST-REPORT.md delivery/WINDOWS-DSU.md \
            delivery/sm-a1560-fingerprint-fix-source-and-validation.zip \
            delivery/SmA1560FingerprintFix.apk --clobber
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" > uploaded-assets.json
          python3 - <<'PY'
          import json, pathlib
          expected = json.loads(pathlib.Path('release-files/DELIVERY.json').read_text())['files']
          actual = {x['name']: x for x in json.loads(pathlib.Path('uploaded-assets.json').read_text())}
          for name, info in expected.items():
              a = actual[name]
              assert a['state'] == 'uploaded' and a['size'] == info['bytes'], name
              assert a['digest'] == 'sha256:' + info['sha256'], name
              print('GitHub asset verified:', name, a['digest'])
          PY
